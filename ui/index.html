<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NNG — Neural Network Graph</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top_bar">
  <h1>NN Graph Builder</h1>
  <div class="menu"><button class="mb">File</button><div class="dd">
    <button data-example="mlp">Example: Custom MLP</button><button data-example="resnet">Example: ResNet</button><button data-example="unet">Example: U-Net</button><button data-example="transformer">Example: Transformer</button>
    <button id="clear_button">Clear</button><button id="save_json_button">Save JSON</button><button id="open_json_button">Open JSON</button>
  </div></div>
  <input type="file" id="file_input" accept=".json" style="display:none">
  <span class="vsep"></span>
  <div id="menu_bar"></div>
  <span class="sp" style="flex:1"></span>
  <button id="auto_layout_button">Auto layout</button>
  <button id="fit_button">Fit view</button>
  <div class="menu right"><button class="mb">Save figure</button><div class="dd"><button id="save_svg_button">SVG</button><button id="save_png_button">PNG</button></div></div>
</div>

<div id="center_area">
  <div id="tab_bar"></div>
  <div id="canvas">
    <div id="world">
      <svg id="wires">
        <defs>
          <marker id="arrow_head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="var(--wire)"/></marker>
          <marker id="arrow_head_selected" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="var(--sel)"/></marker>
        </defs>
        <g id="wire_group"></g>
      </svg>
    </div>
    <div id="selection_box"></div>
    <div id="zoom_info"></div>
  </div>
</div>

<div id="side_panel">
  <div class="row"><h2>torch.nn code</h2><button id="torch_check_button" style="display:none">Check with torch</button><button id="copy_button">Copy</button><button id="save_python_button" class="primary">Save model.py</button></div>
  <pre id="torch_result" style="display:none"></pre>
  <div id="problem_list"></div>
  <pre id="code_view"></pre>
</div>

<script src="js/definitions.js"></script>
<script src="js/graph_model.js"></script>
<script src="js/shape_inference.js"></script>
<script src="js/geometry.js"></script>
<script src="js/node_rendering.js"></script>
<script src="js/blocks_and_tabs.js"></script>
<script src="js/menus_and_popups.js"></script>
<script src="js/code_generation.js"></script>
<script src="js/file_io.js"></script>
<script src="js/layout.js"></script>
<script src="js/interaction.js"></script>
<script src="js/examples.js"></script>
<script src="js/main.js"></script>
</body>
</html>
