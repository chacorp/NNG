[project]
name = "nng"
version = "0.1.0"
description = "Node-graph designer for neural networks that draws paper-style figures and exports torch.nn code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials==6.9.2",
    "PySide6-Addons==6.9.2",
    "torch>=2.0",
]

[project.scripts]
nng = "nng_app.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nng_app"]
